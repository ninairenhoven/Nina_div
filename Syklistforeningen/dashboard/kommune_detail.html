<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Kommunedetaljer – Sykkelundersøkelsen</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --orange:  #F26649;
      --teal:    #71C3B4;
      --dark:    #302026;
      --gray:    #525350;
      --neutral-800: #211f54;
      --neutral-600: #6e7191;
      --neutral-300: #eff0f6;
      --neutral-200: #f7f7fc;
      --shadow:  0 4px 16px #14142b1a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', system-ui, sans-serif; background: var(--neutral-200); color: var(--dark); }

    header {
      background: #fff;
      box-shadow: 0 2px 5px #0003;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 1218px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
    }
    .header-inner img { width: auto; }
    .header-inner .logo-slf     { height: 36px; }
    .header-inner .logo-opinion { height: 48px; }

    .hero {
      background: var(--dark);
      padding: 28px 32px;
    }
    .hero-inner {
      max-width: 1218px;
      margin: 0 auto;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--teal);
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 14px;
      transition: opacity .2s;
    }
    .back-btn:hover { opacity: .75; }
    .back-btn::before { content: '←'; font-size: 1rem; }
    .hero h2 { font-size: 1.8rem; font-weight: 800; color: #fff; letter-spacing: -0.02em; line-height: 1.2; }
    .hero-meta { display: flex; gap: 20px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
    .hero-meta span { font-size: 0.85rem; color: var(--teal); font-weight: 600; }
    .hero-meta .sep { color: #ffffff33; }

    .container { max-width: 1218px; margin: 0 auto; padding: 32px 24px; }


    .charts-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      align-items: stretch;
    }
    @media (max-width: 780px) {
      .charts-grid { grid-template-columns: 1fr; }
    }

    .chart-card {
      background: white;
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 28px 24px;
    }
    .chart-card h3 {
      font-size: 0.9rem; font-weight: 700; color: var(--neutral-600);
      text-transform: uppercase; letter-spacing: .07em;
      margin-bottom: 24px; text-align: center;
    }

    .donut-wrap {
      position: relative;
      width: 200px;
      margin: 0 auto 24px;
    }
    .donut-label {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .donut-label .pct { font-size: 2rem; font-weight: 800; color: var(--neutral-800); line-height: 1; }
    .donut-label .sub { font-size: 0.72rem; color: var(--neutral-600); font-weight: 600; margin-top: 2px; }

    .donut-legend { display: flex; flex-direction: column; gap: 10px; }
    .legend-item  { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--gray); }
    .legend-dot   { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .legend-item strong { color: var(--dark); }

    .timeline-canvas-wrap { position: relative; height: 300px; }

    .state-msg {
      padding: 80px;
      text-align: center;
      color: var(--neutral-600);
      font-size: 0.9rem;
    }
    .state-msg.error { color: #f15f5b; font-weight: 600; }

    footer {
      text-align: center; padding: 16px 24px 32px;
      font-size: 0.75rem; color: var(--neutral-600);
    }
    footer a { color: var(--neutral-600); text-decoration: none; }
    footer a:hover { color: var(--orange); }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="https://www.opinion.no/" target="_blank"><img class="logo-opinion" src="logo/Opinion_Logo_Horizontal.png" alt="Opinion"></a>
    <a href="https://syklistforeningen.no/" target="_blank"><img class="logo-slf" src="logo/SLF_logo_farge.png" alt="Syklistforeningen"></a>
  </div>
</header>

<div class="hero">
  <div class="hero-inner">
    <a class="back-btn" href="mockup_sykkelundersokelsen_opinion_v2.html">Tilbake til oversikt</a>
    <h2 id="hero-navn">Laster…</h2>
    <div class="hero-meta">
      <span id="hero-fylke">–</span>
      <span class="sep">|</span>
      <span id="hero-befolkning">–</span>
      <span class="sep">|</span>
      <span id="hero-storrelse">–</span>
      <span class="sep" id="hero-maal-sep" style="display:none">|</span>
      <span id="hero-maal" style="display:none"></span>
    </div>
  </div>
</div>

<div class="container">

  <div id="main-content" class="state-msg">Laster data…</div>

</div>

<footer>
  <span id="footer-ts"></span>
  <br><br><a href="https://www.opinion.no" target="_blank">Opinion.no</a> | <a href="https://www.opinion.no/kontakt" target="_blank">Kontakt oss</a>
</footer>

<script>
const SUMMARY_URL = "https://dl.dropboxusercontent.com/scl/fi/ygp0go1mypvoy3n8b91wy/summary_kommuner_dummy.csv?rlkey=13jlrj8gioxsbjyk1eg7y69al&st=2nf2d6k7";
const DETAIL_URL  = "https://dl.dropboxusercontent.com/scl/fi/hs5pobmce7dx2i09rr13k/data_kommuner_dummy.csv?rlkey=k11tx1jhlxpd0hmots0t2dden&st=n6k20m7p";

const CSS = getComputedStyle(document.documentElement);
const C_TEAL   = CSS.getPropertyValue('--teal').trim();
const C_ORANGE = CSS.getPropertyValue('--orange').trim();

function formatTimestamp(ts) {
  const [date, time] = ts.split(' ');
  if (!date) return ts;
  const [y, m, d] = date.split('-');
  const months = ['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
  return `${+d}. ${months[+m - 1]} ${y}${time ? ' kl. ' + time : ''}`;
}

function parseCSV(text) {
  const lines = text.trim().split('\n').map(l => l.replace(/^\uFEFF/, ''));
  let start = 0, oppdatert = null;
  if (lines[0].startsWith('Oppdatert,')) {
    oppdatert = lines[0].split(',')[1].trim();
    start = 1;
  }
  const headers = lines[start].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
  const rows = lines.slice(start + 1).map(line => {
    const vals = line.split(',').map(v => v.trim().replace(/^"|"$/g, ''));
    const obj = {};
    headers.forEach((h, i) => obj[h] = vals[i]);
    return obj;
  });
  rows._oppdatert = oppdatert;
  return rows;
}

async function init() {
  const params = new URLSearchParams(location.search);
  const nr = params.get('nr');
  if (!nr) { showError('Ingen kommune valgt.'); return; }

  let summaryRows, detailRows;
  try {
    const [st, dt] = await Promise.all([
      fetch(SUMMARY_URL).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }),
      fetch(DETAIL_URL ).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }),
    ]);
    summaryRows = parseCSV(st);
    detailRows  = parseCSV(dt);
  } catch (e) {
    showError('Kunne ikke laste data: ' + e.message);
    return;
  }

  const summary = summaryRows.find(r => String(r.Kommunenummer).trim() === nr);
  const rows    = detailRows.filter(r => String(r.Kommunenummer).trim() === nr);

  if (!summary && rows.length === 0) { showError('Fant ikke kommune ' + nr + '.'); return; }

  const navn      = summary?.Kommune         ?? rows[0]?.Kommune         ?? nr;
  const fylke     = summary?.Fylke           ?? rows[0]?.Fylke           ?? '–';
  const storrelse = summary?.Kommunestørrelse ?? rows[0]?.Kommunestørrelse ?? '–';
  const bef       = summary?.Befolkning      ?? rows[0]?.Befolkning      ?? '';
  const antall    = rows.length;
  const target    = summary ? +summary.Target : null;
  const pct       = target ? Math.round(antall / target * 100) : null;

  // Hero
  document.title = navn + ' – Sykkelundersøkelsen';
  document.getElementById('hero-navn').textContent      = navn;
  document.getElementById('hero-fylke').textContent     = fylke;
  document.getElementById('hero-storrelse').textContent = storrelse;
  document.getElementById('hero-befolkning').textContent =
    bef ? Number(bef).toLocaleString('nb') + ' innbyggere' : '–';
  if (target != null) {
    document.getElementById('hero-maal').textContent = 'Mål: ' + target.toLocaleString('nb') + ' svar';
    document.getElementById('hero-maal').style.display = '';
    document.getElementById('hero-maal-sep').style.display = '';
  }

  const ts = summaryRows._oppdatert;
  document.getElementById('footer-ts').textContent = ts
    ? 'Oppdatert ' + formatTimestamp(ts)
    : 'Hentet: ' + new Date().toLocaleString('nb-NO', { dateStyle: 'long', timeStyle: 'short' });

  // Render charts
  const content = document.getElementById('main-content');
  content.className = 'charts-grid';
  content.innerHTML = `
    <div class="chart-card">
      <h3>${target != null ? 'Mål: ' + target.toLocaleString('nb') + ' svar' : 'Fremgang'}</h3>
      <div class="donut-wrap">
        <canvas id="donut-chart"></canvas>
        <div class="donut-label">
          <span class="pct" id="donut-pct">–</span>
        </div>
      </div>
      <div class="donut-legend" id="donut-legend"></div>
    </div>
    <div class="chart-card">
      <h3>Innsamling over tid</h3>
      <div class="timeline-canvas-wrap">
        <canvas id="timeline-chart"></canvas>
      </div>
    </div>`;

  buildDonut(antall, target, pct);
  buildTimeline(rows, target);
}

function buildDonut(antall, target, pct) {
  document.getElementById('donut-pct').textContent = pct != null ? pct + '%' : antall;

  const collected = target != null ? Math.min(antall, target) : antall;
  const remaining = target != null ? Math.max(target - antall, 0) : 0;

  const fillColor = pct == null ? C_TEAL
    : pct >= 100 ? C_TEAL
    : pct >= 60  ? '#fce164'
    : '#f15f5b';

  new Chart(document.getElementById('donut-chart'), {
    type: 'doughnut',
    data: {
      labels: ['Innsamlet', 'Gjenstår'],
      datasets: [{
        data: [collected, remaining],
        backgroundColor: [fillColor, '#eff0f6'],
        borderWidth: 0,
        hoverOffset: 4,
      }]
    },
    options: {
      cutout: '72%',
      plugins: { legend: { display: false }, tooltip: { enabled: true } },
      animation: { animateRotate: true, duration: 600 },
    }
  });

  const legend = document.getElementById('donut-legend');
  const legendItems = [
    { color: fillColor, label: 'Innsamlet', value: antall.toLocaleString('nb') },
    { color: '#eff0f6', label: 'Gjenstår',  value: remaining.toLocaleString('nb'), border: true },
  ];
  legend.innerHTML = legendItems.map(i =>
    `<div class="legend-item">
       <div class="legend-dot" style="background:${i.color};${i.border ? 'border:1px solid #aaa' : ''}"></div>
       <span>${i.label}: <strong>${i.value}</strong></span>
     </div>`
  ).join('');
}

function niceMax(val) {
  if (!val || val <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(val)));
  const step = mag >= 10 ? mag / 2 : mag;
  return Math.ceil(val / step) * step;
}

function buildTimeline(rows, target) {
  const counts = {};
  rows.forEach(r => { if (r.Dato) counts[r.Dato] = (counts[r.Dato] || 0) + 1; });

  if (Object.keys(counts).length === 0) {
    document.querySelector('.timeline-canvas-wrap').innerHTML =
      '<p style="padding:40px;text-align:center;color:var(--neutral-600);font-size:.85rem">Ingen datodata tilgjengelig.</p>';
    return;
  }

  const sortedDates = Object.keys(counts).sort();
  const months = ['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];
  const labels = sortedDates.map(d => {
    const [, m, day] = d.split('-');
    return `${+day}. ${months[+m - 1]}`;
  });

  let cum = 0;
  const cumData   = sortedDates.map(d => { cum += counts[d]; return cum; });
  const dailyData = sortedDates.map(d => counts[d]);

  new Chart(document.getElementById('timeline-chart'), {
    data: {
      labels,
      datasets: [
        {
          type: 'bar',
          label: 'Svar per dag',
          data: dailyData,
          backgroundColor: C_TEAL + '66',
          borderColor: C_TEAL,
          borderWidth: 1,
          borderRadius: 4,
          yAxisID: 'yDaily',
          order: 2,
        },
        {
          type: 'line',
          label: 'Totalt',
          data: cumData,
          borderColor: C_ORANGE,
          backgroundColor: C_ORANGE + '18',
          borderWidth: 2.5,
          pointRadius: sortedDates.length > 20 ? 0 : 4,
          pointHoverRadius: 5,
          fill: true,
          tension: 0.3,
          yAxisID: 'yCum',
          order: 1,
        },
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          position: 'bottom',
          labels: { font: { family: 'Poppins', size: 11 }, boxWidth: 12, padding: 16 }
        },
        tooltip: {
          callbacks: { title: items => sortedDates[items[0].dataIndex] }
        }
      },
      scales: {
        x: {
          ticks: { font: { family: 'Poppins', size: 11 }, maxRotation: 45 },
          grid: { display: false },
        },
        yDaily: {
          position: 'left',
          max: niceMax(Math.max(...dailyData) * 1.2),
          title: { display: true, text: 'Daglig', font: { family: 'Poppins', size: 11 }, color: '#45A290' },
          ticks: { font: { family: 'Poppins', size: 11 }, precision: 0, color: '#45A290' },
          grid: { color: '#eff0f6' },
        },
        yCum: {
          position: 'right',
          min: 0,
          max: target != null
            ? (s => Math.ceil(Math.max(target, Math.max(...cumData)) / s) * s)(target % 10 === 0 ? target / 10 : target / 5)
            : undefined,
          title: { display: true, text: 'Totalt', font: { family: 'Poppins', size: 11 }, color: C_ORANGE },
          ticks: {
            precision: 0,
            font: { family: 'Poppins', size: 11 },
            color: ctx => ctx.tick.value === target ? C_TEAL : C_ORANGE,
            ...(target != null ? { stepSize: target % 10 === 0 ? target / 10 : target / 5 } : {}),
          },
          grid: { drawOnChartArea: false },
        }
      }
    }
  });
}

function showError(msg) {
  const el = document.getElementById('main-content');
  el.className = 'state-msg error';
  el.textContent = msg;
}

init();
</script>
</body>
</html>
