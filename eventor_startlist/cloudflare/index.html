<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fjoven startliste</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange:      #F26649;
      --teal:        #71C3B4;
      --teal-dark:   #45A290;
      --dark:        #302026;
      --gray:        #525350;
      --neutral-800: #211f54;
      --neutral-600: #6e7191;
      --neutral-300: #eff0f6;
      --neutral-200: #f7f7fc;
      --shadow:        0 4px 16px #14142b1a;
      --shadow-header: 0 2px 5px #0003;

      /* Fjoven + Fjogstad card (green) */
      --green-light: #D4EAE5;
      --green-dark:  #2E6C60;
      --green-hover: #C0DEDA;

      /* Oppsal råtasser card (blue) */
      --blue-light:      #D4E2EC;
      --blue-button:     #5B82A0;
      --blue-header:     #4d7190;
      --blue-text:       #3a5568;
      --oppsal-row-border: #B8C9D6;
      --oppsal-row-hover:  #C4D4E0;

      /* Table header text */
      --th-text: rgba(255,255,255,0.75);

      /* Nullstill button */
      --reset-bg:     #FCE0DB;
      --reset-border: #f5b8b0;

      /* Error message */
      --error-bg:     #fdecea;
      --error-border: #f15f5b;
      --error-text:   #b91c1c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', system-ui, sans-serif; background: var(--neutral-200); color: var(--dark); }

    /* ── Header ──────────────────────────────────────────────────────────── */
    header {
      background: #A8CEC7; box-shadow: var(--shadow-header);
      padding: 0 12px; position: sticky; top: 0; z-index: 100;
      border-bottom: 2px solid var(--neutral-200);
    }
    .header-inner {
      max-width: 1000px; margin: 0 auto;
      display: flex; align-items: stretch; justify-content: space-evenly;
    }
    .header-tabs { display: flex; align-items: stretch; }
    .header-actions { display: flex; align-items: center; gap: 8px; }

    /* ── Hero ────────────────────────────────────────────────────────────── */
    .hero { background: var(--dark); padding: 14px 32px 14px 16px; }
    .hero-inner { max-width: 1000px; margin: 0 auto; text-align: center; }
    .hero p  { font-size: 1.2rem; font-weight: 800; color: white; letter-spacing: -.02em; display: flex; align-items: baseline; justify-content: center; gap: 10px; }

    #eventor-link-row a { color: var(--teal); text-decoration: none; font-weight: 600; opacity: 0.85; font-size: 0.75rem; }
    #eventor-link-row a:hover { opacity: 1; text-decoration: underline; }
    #hero-link { grid-column: 2; }
    a#pm-link { grid-column: 3; justify-self: center; font-weight: 800; font-size: 0.82rem; color: #B8E2DA; }
    #liveResLink { font-size: 0.82rem; }
    #liveResLink a { color: var(--teal-dark); font-weight: 600; text-decoration: none; }
    #liveResLink a:hover { text-decoration: underline; }

    .container { max-width: 1000px; margin: 0 auto; padding: 24px 20px 40px; }

    /* Hero navigation */
    .hero-nav { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 4px; }
    .hero-date { font-size: 1rem; font-weight: 800; color: #B8E2DA; letter-spacing: -.01em; flex-shrink: 0; }

    #eventor-link-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; margin-top: 6px; }
    .btn-reload-events {
      flex: none; padding: 5px 10px; border-radius: 20px; border: 1px solid var(--neutral-300);
      background: var(--neutral-200); font-family: inherit; font-size: 0.82rem; font-weight: 600;
      color: var(--neutral-600); cursor: pointer; transition: all .15s; line-height: 1.4;
    }
    .btn-reload-events:hover:not(:disabled) { border-color: var(--teal); color: var(--teal-dark); }
    .btn-reload-events:disabled { opacity: 0.35; cursor: default; }

    /* Event picker */
    .hero-event-picker { position: relative; display: inline-block; }
    .btn-velg-lop {
      background: var(--neutral-200); border: 1px solid var(--neutral-300);
      color: var(--neutral-600); font-family: inherit; font-size: 0.82rem; font-weight: 600;
      padding: 5px 14px; border-radius: 20px; cursor: pointer; transition: all .15s;
    }
    .btn-velg-lop:hover:not(:disabled) { border-color: var(--teal); color: var(--teal-dark); }
    .btn-velg-lop:disabled { opacity: 0.35; cursor: default; }
    .velg-lop-panel {
      display: none; position: fixed; top: calc(var(--header-h, 52px) + 6px); left: 50%; transform: translateX(-50%);
      background: white; border-radius: 12px; box-shadow: var(--shadow);
      min-width: 312px; max-height: 320px; overflow-y: auto; z-index: 200; padding: 4px 0;
      scrollbar-width: thin; scrollbar-color: #bbb #f0f0f0;
    }
    .velg-lop-panel::-webkit-scrollbar { width: 4px; }
    .velg-lop-panel::-webkit-scrollbar-track { background: #f0f0f0; border-radius: 2px; }
    .velg-lop-panel::-webkit-scrollbar-thumb { background: #bbb; border-radius: 2px; }
    .velg-lop-panel.open { display: block; }
    .velg-lop-item {
      padding: 10px 18px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
      color: var(--dark); display: flex; align-items: center; gap: 10px;
    }
    .velg-lop-item:hover { background: var(--neutral-200); }
    .velg-lop-item.active { color: var(--teal-dark); }
    .velg-lop-item .ev-date {
      font-size: 0.75rem; font-weight: 700; color: white; background: var(--neutral-600);
      border-radius: 6px; padding: 2px 6px; flex-shrink: 0; font-variant-numeric: tabular-nums;
    }
    .velg-lop-item.active .ev-date { background: var(--teal-dark); }
    .pin-remove {
      background: white; border: none; color: var(--neutral-600); cursor: pointer;
      font-size: 1rem; line-height: 1; padding: 2px 4px; border-radius: 4px; flex-shrink: 0;
    }
    .pin-remove:hover { color: var(--dark); background: var(--neutral-200); }
    @media (max-width: 520px) {
      .table-filters { padding: 10px 12px; gap: 8px; }
      .tf-select, .multiselect-btn { width: 140px; }
    }
    select {
      padding: 10px 14px;
      border: 1px solid var(--neutral-300); border-radius: 10px;
      font-family: inherit; font-size: 0.9rem; font-weight: 600;
      color: var(--dark); background: white; cursor: pointer;
    }
    select:disabled { color: var(--neutral-600); cursor: default; }
    select:focus    { outline: none; border-color: var(--teal); }

    /* ── Messages ────────────────────────────────────────────────────────── */
    .error-msg {
      background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-text);
      padding: 14px 18px; border-radius: 14px; margin-bottom: 18px;
      font-size: 0.88rem; font-weight: 600;
    }
    .loading-msg { text-align: center; color: var(--neutral-600); padding: 64px; font-size: 0.9rem; }

    /* ── Tracked summary ─────────────────────────────────────────────────── */
    .tracked-card {
      background: white; border-radius: 14px; box-shadow: var(--shadow);
      padding: 0; overflow: hidden; margin-bottom: 22px;
    }
    .tracked-card summary {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: var(--neutral-600);
      cursor: pointer; user-select: none; list-style: none;
      display: flex; align-items: center;
      padding: 20px 18px 14px; margin-bottom: 0;
    }
    .tracked-card summary::-webkit-details-marker { display: none; }
    .tracked-card summary::before {
      content: '▾'; font-size: 1rem; color: var(--neutral-800); opacity: 0.7;
      transition: transform .2s; display: inline-block; margin-right: 8px;
    }
    .tracked-card details:not([open]) summary { padding-bottom: 20px; }
    .tracked-card details:not([open]) summary::before { transform: rotate(-90deg); }
    .tracked-list { display: flex; flex-direction: column; padding: 0 18px 18px; }
    .tracked-person {
      display: grid;
      grid-template-columns: 3.5rem 1fr auto;
      align-items: center;
      gap: 0 16px;
      padding: 10px 14px;
      border-radius: 10px;
    }
    .tracked-person + .tracked-person { margin-top: 4px; }
    .tracked-person.found  { background: var(--green-light); border: 1px solid var(--green-dark); }
    .tracked-person .ttime {
      font-size: 0.92rem; font-weight: 800; font-variant-numeric: tabular-nums;
      color: var(--neutral-800); text-align: center;
    }
    .tracked-person .tname  { font-size: 0.88rem; font-weight: 700; color: var(--dark); }
    .tracked-person .tdetail { font-size: 0.78rem; font-weight: 600; color: var(--green-dark); text-align: right; }
    .class-link { cursor: pointer; }
    .class-link:hover { text-decoration: underline; }

    /* ── Stats ───────────────────────────────────────────────────────────── */
    .stats-bar { font-size: 0.82rem; font-weight: 600; color: var(--neutral-600); margin-bottom: 14px; padding: 0 2px; }
    .stats-bar strong { color: var(--neutral-800); }

    /* ── Table filter bar ───────────────────────────────────────────────── */
    .table-filters {
      padding: 0 2px 14px; margin-bottom: 0;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    .tf-select {
      flex: none; width: 160px; padding: 6px 10px; border: 1px solid var(--neutral-300); border-radius: 8px;
      font-family: inherit; font-size: 0.82rem; font-weight: 600;
      color: var(--dark); background: var(--neutral-200); cursor: pointer;
    }
    .tf-select:focus { outline: none; border-color: var(--teal); }
    .btn-clear {
      padding: 6px 14px; border-radius: 48px; border: 1px solid var(--reset-border);
      background: var(--reset-bg); font-family: inherit; font-size: 0.78rem; font-weight: 600;
      color: var(--neutral-600); cursor: pointer; transition: all .15s; margin-left: auto;
    }
    .btn-clear:hover { border-color: var(--orange); color: var(--orange); }

    /* ── Multi-select dropdown ──────────────────────────────────────────── */
    .multiselect { position: relative; }
    .multiselect-btn {
      padding: 6px 28px 6px 10px; border: 1px solid var(--neutral-300); border-radius: 8px;
      font-family: inherit; font-size: 0.82rem; font-weight: 600;
      color: var(--dark); background: var(--neutral-200); cursor: pointer;
      width: 160px; text-align: left; position: relative; white-space: nowrap;
    }
    .multiselect-btn::after {
      content: '▾'; position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
      font-size: 0.7rem; color: var(--neutral-600); pointer-events: none;
    }
    .multiselect-btn:focus { outline: none; border-color: var(--teal); }
    .multiselect-btn.has-selection { border-color: var(--teal); color: var(--teal-dark); }
    .multiselect-panel {
      position: absolute; top: calc(100% + 4px); left: 0; z-index: 200;
      background: white; border: 1px solid var(--neutral-300); border-radius: 10px;
      box-shadow: var(--shadow); min-width: 100%; max-height: 384px; overflow-y: auto;
      padding: 4px 0; display: none;
    }
    .multiselect-panel.open { display: block; }
    .ms-option {
      display: flex; align-items: center; gap: 9px;
      padding: 7px 14px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
      color: var(--dark); user-select: none;
    }
    .ms-option:hover { background: var(--neutral-200); }
    .ms-option input[type=checkbox] { accent-color: var(--teal); width: 14px; height: 14px; flex-shrink: 0; }

    /* ── Start list table ───────────────────────────────────────────────── */
    table { width: 100%; border-collapse: collapse; }
    thead th {
      padding: 8px 6px; font-size: 0.68rem; font-weight: 700;
      color: var(--th-text); text-transform: uppercase; letter-spacing: .07em;
      text-align: left; background: var(--dark);
      border-bottom: none; white-space: nowrap;
    }
    thead th.sortable { cursor: pointer; user-select: none; }
    thead th.sortable:hover { color: white; }
    thead th .sort-icon { margin-left: 2px; opacity: 0.35; font-style: normal; font-size: 0.65rem; }
    thead th.sort-asc .sort-icon,
    thead th.sort-desc .sort-icon { opacity: 1; color: var(--teal); }
    tbody tr { border-bottom: 1px solid var(--neutral-300); transition: background .15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover td { background: var(--neutral-200); }
    td { padding: 3px 6px; font-size: 0.875rem; color: var(--gray); min-height: 33px; height: 33px; }
    td.name { font-weight: 600; color: var(--dark); width: 35%; }
    td.time { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--neutral-800); white-space: nowrap; padding-left: 8px; padding-right: 8px; text-align: center; }
    th.time { width: 1px; white-space: nowrap; padding-left: 8px; padding-right: 8px; text-align: center; }

    td.filterable { cursor: pointer; }
    td.filterable:hover { text-decoration: underline; }

    tr.tracked td       { background: #E8F5F1; }
    tr.tracked td.name  { color: var(--green-dark); }
    tr.tracked:hover td { background: #D8EDE8; }
    tr.oppsal td        { background: #eaf2f7; }
    tr.oppsal:hover td  { background: #d8eaf3; }

    .hidden { display: none !important; }

    /* ── Oppsal råtasser table ──────────────────────────────────────────────── */
    .oppsal-table-wrap { overflow-x: auto; margin: 0; border-radius: 0 0 14px 14px; }
    .oppsal-table-wrap table { width: 100%; border-collapse: collapse; }
    .oppsal-table-wrap thead th {
      padding: 8px 18px; font-size: 0.68rem; font-weight: 700;
      color: var(--th-text); text-transform: uppercase; letter-spacing: .07em;
      text-align: left; background: var(--blue-header); white-space: nowrap;
    }
    .oppsal-table-wrap thead th.sortable { cursor: pointer; user-select: none; }
    .oppsal-table-wrap thead th.sortable:hover { color: white; }
    .oppsal-table-wrap thead th .sort-icon { margin-left: 4px; opacity: 0.35; font-style: normal; font-size: 0.65rem; }
    .oppsal-table-wrap thead th.sort-asc .sort-icon,
    .oppsal-table-wrap thead th.sort-desc .sort-icon { opacity: 1; color: var(--blue-light); }
    .oppsal-table-wrap tbody tr { border-bottom: 1px solid var(--oppsal-row-border); transition: background .15s; }
    .oppsal-table-wrap tbody tr:last-child { border-bottom: none; }
    .oppsal-table-wrap td { padding: 6px 18px; font-size: 0.875rem; background: var(--blue-light); color: var(--blue-text); }
    .oppsal-table-wrap td.name { font-weight: 600; color: var(--dark); }
    .oppsal-table-wrap th.time { width: 6%; padding-left: 8px; padding-right: 4px; }
    .oppsal-table-wrap td.time { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; padding-left: 8px; padding-right: 4px; }
    .oppsal-table-wrap tbody tr:hover td { background: var(--oppsal-row-hover); }
    .oppsal-table-wrap th:nth-child(3),
    .oppsal-table-wrap td:nth-child(3) { width: 23%; padding-left: 8px; padding-right: 8px; }

    /* ── Section spacing ────────────────────────────────────────────────────── */
    #oppsalCard { margin-bottom: 20px; }
    #liveRaatCard { padding: 0 10px 10px; }

    /* ── Main table (inside tracked-card) ───────────────────────────────────── */
    .main-table-wrap { overflow-x: auto; margin: 0; border-radius: 0 0 14px 14px; }
    .main-table-wrap table { width: 100%; border-collapse: collapse; }
    .main-table-wrap thead th { background: var(--blue-header); }
    .main-table-wrap th.time        { min-width: 56px; }
    .main-table-wrap th[data-col="name"]  { min-width: 160px; }
    .main-table-wrap th[data-col="class"] { min-width: 110px; }
    .main-table-wrap th[data-col="club"]  { min-width: 130px; }

    /* ── Show-list button ───────────────────────────────────────────────────── */
    .btn-show-list {
      display: block; width: 100%; padding: 8px;
      background: var(--blue-button); color: white; border: none; border-radius: 14px;
      font-family: inherit; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    .btn-show-list:hover { background: var(--blue-header); }

    /* ── Pagination ─────────────────────────────────────────────────────────── */
    .pagination {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      padding: 16px 0 4px;
    }
    .pg-btn {
      padding: 6px 18px; border-radius: 48px; border: 1px solid var(--neutral-300);
      background: none; font-family: inherit; font-size: 0.82rem; font-weight: 600;
      color: var(--neutral-600); cursor: pointer; transition: all .15s;
    }
    .pg-btn:hover:not(:disabled) { border-color: var(--teal); color: var(--teal-dark); }
    .pg-btn:disabled { opacity: 0.35; cursor: default; }
    .pg-info { font-size: 0.82rem; font-weight: 600; color: var(--neutral-600); }

    /* ── Tab bar (lives in header) ──────────────────────────────────────────── */
    .tab-btn {
      padding: 14px 12px; border: none; background: none;
      font-family: inherit; font-size: 0.92rem; font-weight: 800;
      color: var(--neutral-600); cursor: pointer;
      border-bottom: 3px solid transparent; margin-bottom: -2px;
      transition: color .15s, border-color .15s;
    }
    .tab-btn.active { color: var(--dark); border-bottom-color: var(--orange); }
    .tab-btn:hover:not(.active) { color: var(--dark); }

    /* ── Live results ───────────────────────────────────────────────────────── */
    .lraat-sort { display: flex; align-items: center; gap: 5px; margin-left: auto; }
    .lraat-sort-icon { font-size: 0.85rem; opacity: 0.5; margin-right: 2px; }
    .lraat-sort-btn {
      font-family: inherit; font-size: 0.7rem; font-weight: 700;
      padding: 2px 8px; border-radius: 20px; border: none; cursor: pointer;
      background: var(--neutral-300); color: var(--neutral-600); transition: background .15s, color .15s;
    }
    .lraat-sort-btn.active { background: var(--blue-button); color: white; }
    .live-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
    }
    .live-title-block { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .live-title {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: var(--neutral-600);
    }
    .live-updated { font-size: 0.72rem; color: var(--neutral-600); }
    .btn-refresh {
      padding: 6px 16px; border-radius: 48px; border: none;
      background: var(--blue-button); color: white;
      font-family: inherit; font-size: 0.78rem; font-weight: 600;
      cursor: pointer; transition: background .15s; white-space: nowrap;
    }
    .btn-refresh:hover { background: var(--blue-header); }

    .live-list { display: flex; flex-direction: column; gap: 6px; }
    .live-person { padding: 8px 16px; border-radius: 12px; }
    .live-person.live-done    { background: var(--green-light); border: 1px solid var(--green-dark); }
    .live-person.live-running { background: #FCE0DB;             border: 1px solid #e8b8b0; }
    .live-person.live-bad     { background: var(--neutral-300); border: 1px solid #ccc; }
    .live-person.live-blue.live-done    { background: var(--blue-light); border-color: #8aadcc; }
    .live-person.live-blue.live-running { background: #FCE0DB;           border-color: #e8b8b0; }

    .live-row1 {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 4px;
    }
    .live-row2 { display: flex; align-items: center; }
    .live-timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 0.82rem; color: var(--neutral-600); }
    .live-pname    { font-size: 0.88rem; font-weight: 700; color: var(--dark); }
    .live-pclass   { font-size: 0.78rem; font-weight: 600; color: var(--green-dark); }
    .live-blue .live-pclass { color: var(--blue-text); }
    .live-pdetails { font-size: 0.78rem; font-weight: 600; color: var(--neutral-600); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-tabs">
      <button class="tab-btn active" id="tabStartBtn">Startliste</button>
      <button class="tab-btn" id="tabLiveBtn">Resultater</button>
    </div>
    <div class="header-actions">
      <div class="hero-event-picker">
        <button class="btn-velg-lop" id="velgLopBtn" disabled>Velg løp ▾</button>
        <div class="velg-lop-panel" id="velgLopPanel"></div>
      </div>
      <button class="btn-reload-events" id="reloadEventsBtn" title="Hent nye data fra Eventor" disabled>↺</button>
    </div>
  </div>
</header>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-nav">
      <p id="hero-sub">Laster inn løp…</p>
    </div>
    <div id="eventor-link-row" class="hidden">
      <a id="hero-link" href="#" target="_blank"></a>
      <a id="pm-link" href="#" target="_blank" class="hidden">PM</a>
    </div>
    <select id="eventSelect" style="display:none" disabled>
      <option value="">Laster arrangementer…</option>
    </select>
  </div>
</div>

<div class="container">

  <div id="message"></div>

  <div id="tab-start">
    <div id="trackedCard" class="tracked-card hidden"></div>
    <div id="oppsalCard" class="tracked-card hidden"></div>
    <div id="startList"></div>
  </div>

  <div id="tab-live" class="hidden">
    <div id="liveResLink" class="hidden"></div>
    <div id="liveCard"></div>
    <div id="liveRaatSection" class="hidden" style="margin-top:8px">
      <div class="tracked-card">
        <details id="liveRaatDetails">
          <summary id="liveRaatSummary">Råtasser</summary>
          <div id="liveRaatCard"></div>
        </details>
      </div>
    </div>
  </div>


</div>


<script>
  // ── Class sort ─────────────────────────────────────────────────────────────
  // Order: 1) "åpen" classes (alpha), 2) D/H age classes by age then D<H, 3) rest (alpha)
  function classSortKey(name) {
    const lower = name.toLowerCase();
    if (lower.includes('åpen')) return [0, lower];
    const m = name.match(/^([DdHh])\s*(\d+)/);
    if (m) return [1, parseInt(m[2], 10), m[1].toUpperCase() === 'D' ? 0 : 1, lower];
    return [2, lower];
  }
  function compareClasses(a, b) {
    const ka = classSortKey(a), kb = classSortKey(b);
    const len = Math.max(ka.length, kb.length);
    for (let i = 0; i < len; i++) {
      const va = ka[i], vb = kb[i];
      if (va === vb) continue;
      if (va === undefined) return -1;
      if (vb === undefined) return 1;
      if (va < vb) return -1;
      if (va > vb) return 1;
    }
    return 0;
  }

  function cmpStartTime(a, b, dir = 1) {
    if (!a.startTime && !b.startTime) return 0;
    if (!a.startTime) return 1;
    if (!b.startTime) return -1;
    return a.startTime.localeCompare(b.startTime) * dir;
  }

  // ── Configuration ──────────────────────────────────────────────────────────
  // Local dev: leave as '' (Flask handles the routes).
  // Production: set to your Worker URL, e.g. 'https://eventor-startliste.yourname.workers.dev'
  const WORKER_URL = '/eventor';

  const TRACKED = [
    "Nina Iren Hoven",
    "Sindre Fjogstad",
    "Oskar Hoven Fjogstad",
    "Benjamin Hoven Fjogstad",
    "Bjørg Ingunn Fjogstad",
    "Anders Fjogstad",
  ];

  const TRACKED_DISPLAY = {
    "Nina Iren Hoven":         "Nina",
    "Sindre Fjogstad":         "Sindre",
    "Oskar Hoven Fjogstad":    "Oskar",
    "Benjamin Hoven Fjogstad": "Benjamin",
    "Bjørg Ingunn Fjogstad":   "Bjørg Ingunn",
    "Anders Fjogstad":         "Anders",
  };

  const OPPSAL_CLASSES = new Set(['N1-åpen', 'N2-åpen 9-16', 'C-åpen 10-16',
                                   'D 9-10', 'H 9-10', 'D 11-12', 'H 11-12',
                                   'H Rekrutt', 'D Rekrutt']);
  const isOppsalClass = cls => OPPSAL_CLASSES.has(cls) || /N[12]/i.test(cls);

  // ── Råtass member list (from o.fjoven.com) ────────────────────────────────
  let ratassNames   = new Set();   // full names of is_ratass=1 members (original case)
  let ratassNamesLC = new Set();   // lowercase version for case-insensitive lookup

  function isRatass(fullName) {
    return ratassNames.has(fullName) || ratassNamesLC.has((fullName || '').toLowerCase());
  }

  function isTooOldForRatass(cls) {
    const m = cls.match(/^[DdHh]\s*(\d+)/);
    return m ? parseInt(m[1], 10) >= 13 : false;
  }

  function isOppsalRunner(c) {
    if (isTooOldForRatass(c.class)) return false;
    if (/^[AB]/.test(c.class)) return false;
    return isRatass(c.fullName)
        || (c.club.toLowerCase().includes('oppsal') && isOppsalClass(c.class))
        || pinnedRunners.has(c.fullName);
  }

  function shortenName(fullName) {
    const parts = fullName.split(' ');
    if (parts.length < 3) return fullName;
    parts[parts.length - 2] = parts[parts.length - 2][0] + '.';
    return parts.join(' ');
  }

  function shortClub(name) {
    return name.replace(/\s*\borientering\b\s*/gi, ' ').trim();
  }

  function fmtTime(t) {
    if (!t) return '';
    const parts = t.split(':');
    return parts.length >= 2 ? `${parts[0]}:${parts[1]}` : t;
  }

  function fmtMs(ms) {
    if (ms == null) return '–';
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    return `${m}:${String(sec).padStart(2,'0')}`;
  }

  // ── Event list state ───────────────────────────────────────────────────────
  let allEvents = [];
  let pinnedEventIds = new Set();
  let pinnedRunners = new Set();

  // ── XML helpers ────────────────────────────────────────────────────────────
  const xmlParser = new DOMParser();
  function parseXml(str) { return xmlParser.parseFromString(str, 'application/xml'); }

  function child(el, name) {
    return Array.from(el.children).find(c => c.localName === name) || null;
  }
  function children(el, name) {
    return Array.from(el.children).filter(c => c.localName === name);
  }
  function walkAll(root, name) {
    return Array.from(root.getElementsByTagName('*')).filter(el => el.localName === name);
  }
  function txt(el, ...path) {
    let cur = el;
    for (const name of path) { if (!cur) return ''; cur = child(cur, name); }
    return cur?.textContent?.trim() || '';
  }

  // ── Parse events XML ───────────────────────────────────────────────────────
  function parseEvents(doc) {
    const events = {};
    for (const startList of walkAll(doc, 'StartList')) {
      const ev = child(startList, 'Event');
      if (!ev) continue;
      const id = txt(ev, 'EventId');
      if (!id || events[id]) continue;
      events[id] = { id, name: txt(ev, 'Name') || `Event ${id}`,
        date: txt(ev, 'StartDate', 'Date') || txt(ev, 'StartDate') };
    }
    return Object.values(events).sort((a, b) => a.date.localeCompare(b.date));
  }

  // ── Parse tracked starts from /my-events XML ──────────────────────────────
  function parseTrackedStarts(doc) {
    const result = {};
    for (const startList of walkAll(doc, 'StartList')) {
      const ev = child(startList, 'Event');
      if (!ev) continue;
      const eventId = txt(ev, 'EventId');
      if (!eventId) continue;
      if (!result[eventId]) result[eventId] = [];
      for (const classStart of walkAll(startList, 'ClassStart')) {
        const className = txt(classStart, 'EventClass', 'Name') ||
                          txt(classStart, 'Class', 'Name') || '';
        for (const ps of children(classStart, 'PersonStart')) {
          const person  = child(ps, 'Person') || walkAll(ps, 'Person')[0] || null;
          const nameEl  = person ? child(person, 'PersonName') || child(person, 'Name') : null;
          const given   = txt(nameEl, 'Given');
          const family  = txt(nameEl, 'Family');
          const org     = walkAll(ps, 'Organisation')[0] || null;
          const club    = org ? (txt(org, 'ShortName') || txt(org, 'Name')) : '';
          const startEl = child(ps, 'Start');
          let startTime = '';
          if (startEl) {
            const st = child(startEl, 'StartTime');
            startTime = st ? (txt(st, 'Clock') || st.textContent.trim()) : '';
          }
          const fullName = `${given} ${family}`.trim();
          result[eventId].push({ firstName: given, lastName: family, fullName,
            club, class: className, startTime, tracked: true });
        }
      }
    }
    for (const id of Object.keys(result)) {
      result[id].sort(cmpStartTime);
    }
    return result;
  }

  // ── Parse start list XML ───────────────────────────────────────────────────
  function parseStartList(doc) {
    const competitors = [];

    for (const classStart of walkAll(doc, 'ClassStart')) {
      const className = txt(classStart, 'EventClass', 'Name') ||
                        txt(classStart, 'Class', 'Name') || 'Unknown';

      for (const ps of children(classStart, 'PersonStart')) {
        const person = child(ps, 'Person') || walkAll(ps, 'Person')[0] || null;
        const nameEl = person ? child(person, 'PersonName') || child(person, 'Name') : null;

        const given  = txt(nameEl, 'Given');
        const family = txt(nameEl, 'Family');

        const org  = walkAll(ps, 'Organisation')[0] || null;
        const club = org ? (txt(org, 'ShortName') || txt(org, 'Name')) : '';

        const startEl = child(ps, 'Start');
        let startTime = '';
        if (startEl) {
          const st = child(startEl, 'StartTime');
          startTime = st ? (txt(st, 'Clock') || st.textContent.trim()) : '';
        }

        const fullName = `${given} ${family}`.trim();
        competitors.push({
          firstName: given, lastName: family, fullName,
          club, class: className, startTime,
          tracked: TRACKED.includes(fullName),
        });
      }
    }

    competitors.sort((a, b) => compareClasses(a.class, b.class) || cmpStartTime(a, b));
    return competitors;
  }

  // ── Parse entry registrations (no start times) ────────────────────────────
  function parseEntries(doc) {
    const competitors = [];
    for (const entry of walkAll(doc, 'Entry')) {
      const competitor = child(entry, 'Competitor');
      const person = competitor ? child(competitor, 'Person') : child(entry, 'Person');
      const nameEl = person ? child(person, 'PersonName') || child(person, 'Name') : null;
      const given  = txt(nameEl, 'Given');
      const family = txt(nameEl, 'Family');
      const org    = walkAll(entry, 'Organisation')[0] || null;
      const club   = org ? (txt(org, 'ShortName') || txt(org, 'Name')) : '';
      const classEl = child(entry, 'Class');
      const cls    = classEl ? (txt(classEl, 'Name') || classEl.textContent.trim()) : '';
      const fullName = `${given} ${family}`.trim();
      if (!fullName) continue;
      competitors.push({
        firstName: given, lastName: family, fullName,
        club, class: cls, startTime: '',
        tracked: TRACKED.includes(fullName),
      });
    }
    competitors.sort((a, b) => compareClasses(a.class, b.class) || a.fullName.localeCompare(b.fullName));
    return competitors;
  }

  // ── Filter UI ──────────────────────────────────────────────────────────────
  function populateEventSelect() {
    const sel = document.getElementById('eventSelect');
    if (!allEvents.length) { sel.disabled = true; return; }
    sel.innerHTML = allEvents.map(e =>
      `<option value="${e.id}">${e.date} – ${e.name}</option>`
    ).join('');
    sel.disabled = false;
    populateVelgLopPanel();
  }

  function populateVelgLopPanel() {
    const panel = document.getElementById('velgLopPanel');
    const currentId = document.getElementById('eventSelect').value;
    panel.innerHTML = allEvents.map(e => {
      const parts = e.date ? e.date.split('-') : [];
      const dateStr = parts.length === 3 ? `${parts[2]}/${parts[1]}` : (e.date || '');
      const pinned = pinnedEventIds.has(e.id);
      return `<div class="velg-lop-item${e.id === currentId ? ' active' : ''}" data-id="${e.id}">
        ${dateStr ? `<span class="ev-date">${dateStr}</span>` : ''}
        <span style="flex:1">${e.name}</span>
        ${pinned ? `<button class="pin-remove" data-id="${e.id}" title="Fjern fra liste">×</button>` : ''}
      </div>`;
    }).join('') + `<div class="velg-lop-item" id="velgLopAddBtn" style="color:var(--teal-dark);border-top:1px solid var(--neutral-300);margin-top:4px">
      <span>+ Legg til løp</span>
    </div>`;

    panel.querySelectorAll('.velg-lop-item[data-id]').forEach(item => {
      item.addEventListener('click', () => {
        const sel = document.getElementById('eventSelect');
        sel.value = item.dataset.id;
        sel.dispatchEvent(new Event('change'));
        panel.classList.remove('open');
      });
    });
    panel.querySelectorAll('.pin-remove').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        removePinnedEvent(btn.dataset.id);
      });
    });
    document.getElementById('velgLopAddBtn').addEventListener('click', e => {
      e.stopPropagation();
      showAddEventInput();
    });
  }

  function showAddEventInput() {
    const panel = document.getElementById('velgLopPanel');
    const addBtn = document.getElementById('velgLopAddBtn');
    addBtn.outerHTML = `<div id="velgLopAddArea" style="padding:8px 12px;border-top:1px solid var(--neutral-300);margin-top:4px">
      <input id="velgLopAddInput" type="text" autocomplete="off" placeholder="Eventor-ID eller lenke…"
        style="width:100%;padding:6px 8px;font-family:inherit;font-size:0.82rem;border:1px solid var(--neutral-300);border-radius:8px;outline:none;box-sizing:border-box">
      <div id="velgLopAddMsg" style="font-size:0.75rem;color:var(--error-text);padding:3px 2px;min-height:1.1em"></div>
    </div>`;
    const input = document.getElementById('velgLopAddInput');
    input.focus();
    input.addEventListener('keydown', async e => {
      if (e.key === 'Escape') { populateVelgLopPanel(); return; }
      if (e.key !== 'Enter') return;
      const val = input.value.trim();
      const m = val.match(/\/Events\/Show\/(\d+)/) || val.match(/[?&]eventId=(\d+)/) || val.match(/^(\d+)$/);
      if (!m) { document.getElementById('velgLopAddMsg').textContent = 'Ugyldig — skriv inn et løps-ID eller Eventor-lenke'; return; }
      const eventId = m[1];
      document.getElementById('velgLopAddMsg').textContent = 'Henter…';
      try {
        const resp = await fetch(`${WORKER_URL}/pinned-events?eventId=${eventId}`, { method: 'POST' });
        const data = await resp.json();
        if (!resp.ok) { document.getElementById('velgLopAddMsg').textContent = data.error || 'Feil'; return; }
        pinnedEventIds.add(data.id);
        if (!allEvents.find(e => e.id === data.id)) {
          allEvents.push({ id: data.id, name: data.name, date: data.date });
          allEvents.sort((a, b) => a.date.localeCompare(b.date));
          populateEventSelect();
        }
        populateVelgLopPanel();
        const sel = document.getElementById('eventSelect');
        sel.value = data.id;
        sel.dispatchEvent(new Event('change'));
        panel.classList.remove('open');
      } catch { document.getElementById('velgLopAddMsg').textContent = 'Nettverksfeil'; }
    });
  }

  async function removePinnedEvent(eventId) {
    await fetch(`${WORKER_URL}/pinned-events?eventId=${eventId}`, { method: 'DELETE' }).catch(() => {});
    pinnedEventIds.delete(eventId);
    // Keep the event in allEvents if it also appears in a start list for a tracked runner
    allEvents = allEvents.filter(e => e.id !== eventId || !!trackedStartsByEvent[e.id]?.length);
    populateEventSelect();
    populateVelgLopPanel();
  }


  // ── localStorage helpers (silently degrade in private browsing) ────────────
  function lsGet(key) { try { return lsGet(key); } catch { return null; } }
  function lsSet(key, val) { try { lsSet(key, String(val)); } catch {} }
  function lsRemove(key) { try { lsRemove(key); } catch {} }

  // ── UI helpers ─────────────────────────────────────────────────────────────
  function setMessage(text) {
    const el = document.getElementById('message');
    el.innerHTML = '';
    if (text) {
      const div = document.createElement('div');
      div.className = 'error-msg';
      div.textContent = text;
      el.appendChild(div);
    }
  }

  function updateHero(eventId) {
    const row  = document.getElementById('eventor-link-row');
    const link = document.getElementById('hero-link');
    const ev   = allEvents.find(e => e.id === eventId);
    if (eventId && ev) {
      const parts = ev.date ? ev.date.split('-') : [];
      const dateStr = parts.length === 3 ? `${parts[2]}/${parts[1]}` : '';
      document.getElementById('hero-sub').innerHTML = dateStr
        ? `<span class="hero-date">${dateStr}</span>${ev.name}`
        : ev.name;
      link.href = `https://eventor.orientering.no/Events/Show/${eventId}`;
      link.textContent = `eventor.orientering.no/Events/Show/${eventId}`;
      document.getElementById('pm-link').classList.add('hidden');
      row.classList.remove('hidden');
    } else {
      document.getElementById('hero-sub').textContent = 'Velg et løp';
      document.getElementById('pm-link').classList.add('hidden');
      row.classList.add('hidden');
    }
  }

  function renderTrackedForEvent(eventId) {
    const card = document.getElementById('trackedCard');
    let starts = trackedStartsByEvent[eventId] || [];
    if (!starts.length) {
      starts = allCompetitors.filter(c => c.tracked);
    }
    if (!starts.length) { card.classList.add('hidden'); return; }
    const rows = starts.map(c => `
      <div class="tracked-person found">
        <div class="ttime">${fmtTime(c.startTime) || '–'}</div>
        <div class="tname">${TRACKED_DISPLAY[c.fullName] || c.firstName}</div>
        <div class="tdetail"><span class="class-link" data-class="${c.class.replace(/"/g, '&quot;')}">${c.class}</span></div>
      </div>`).join('');
    card.innerHTML = `<details open><summary>Fjoven + Fjogstad</summary><div class="tracked-list">${rows}</div></details>`;
    card.classList.remove('hidden');
    card.querySelectorAll('.class-link').forEach(el => {
      el.addEventListener('click', () => {
        pendingClassFilter = el.dataset.class;
        loadStartList();
      });
    });
  }

  function showEventPreview(eventId) {
    if (eventId !== cachedStartListEventId) {
      allCompetitors = [];
      cachedStartListEventId = null;
      liveAllEntries = [];
    }
    document.getElementById('oppsalCard').classList.add('hidden');
    document.getElementById('startList').innerHTML = '';
    loadEventDocs(eventId);
    renderTrackedForEvent(eventId);
    document.getElementById('startList').innerHTML = `
      <div style="display:flex; flex-direction:column; gap:6px;">
        <button class="btn-show-list" id="showOppsalBtn">Vis råtasser</button>
        <button class="btn-show-list" id="showTableBtn">Vis startliste</button>
      </div>`;
    document.getElementById('showOppsalBtn').addEventListener('click', loadOppsalOnly);
    document.getElementById('showTableBtn').addEventListener('click', loadStartList);
    if (startOppsalVisible) {
      loadOppsalOnly();
    } else if (!trackedStartsByEvent[eventId]?.length) {
      loadCompetitors(eventId).then(competitors => {
        if (document.getElementById('eventSelect').value !== eventId) return;
        allCompetitors = competitors;
        cachedStartListEventId = eventId;
        renderTrackedForEvent(eventId);
      }).catch(() => {});
    }
  }

  function renderOppsalTable() {
    const sorted = [...oppsalCompetitors].sort((a, b) => {
      const { col, dir } = oppsalSort;
      if (col === 'startTime') return cmpStartTime(a, b, dir);
      const map = { name: 'fullName', class: 'class' };
      return (a[map[col]] || '').localeCompare(b[map[col]] || '') * dir;
    });

    document.getElementById('oppsalTbody').innerHTML = sorted.map(c => `
      <tr>
        <td class="time">${fmtTime(c.startTime) || '–'}</td>
        <td class="name">${shortenName(c.fullName)}</td>
        <td>${c.class}</td>
      </tr>`).join('');

    document.querySelectorAll('.oppsal-table-wrap thead th.sortable').forEach(th => {
      const col = th.dataset.col;
      const icon = th.querySelector('.sort-icon');
      th.classList.remove('sort-asc', 'sort-desc');
      if (col === oppsalSort.col) {
        th.classList.add(oppsalSort.dir === 1 ? 'sort-asc' : 'sort-desc');
        icon.textContent = oppsalSort.dir === 1 ? '▲' : '▼';
      } else {
        icon.textContent = '⇅';
      }
    });
  }

  function renderOppsalCard(competitors, open = true) {
    const card = document.getElementById('oppsalCard');
    oppsalCompetitors = competitors.filter(isOppsalRunner);
    if (!oppsalCompetitors.length) { card.classList.add('hidden'); return; }

    card.innerHTML = `<details${open ? ' open' : ''}><summary>Oppsal råtasser: ${oppsalCompetitors.length} deltagere</summary>
      <div class="oppsal-table-wrap">
        <table>
          <thead><tr>
            <th class="time sortable sort-asc" data-col="startTime">Start <i class="sort-icon">▲</i></th>
            <th class="sortable" data-col="name">Navn <i class="sort-icon">⇅</i></th>
            <th class="sortable" data-col="class">Klasse <i class="sort-icon">⇅</i></th>
          </tr></thead>
          <tbody id="oppsalTbody"></tbody>
        </table>
      </div>
    </details>`;
    card.classList.remove('hidden');

    document.querySelectorAll('.oppsal-table-wrap thead th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.col;
        oppsalSort = col === oppsalSort.col
          ? { col, dir: oppsalSort.dir * -1 }
          : { col, dir: 1 };
        renderOppsalTable();
      });
    });

    renderOppsalTable();
  }

  // ── Start list table state ────────────────────────────────────────────────
  let allCompetitors = [];
  let trackedStartsByEvent = {}; // eventId → [competitor, ...]
  let cachedStartListEventId = null;
  let tableFilter = { classes: new Set(), club: '', name: '' };
  let pendingClassFilter = null;  // class name to pre-select on next showTable()
  let tableSort   = { col: 'startTime', dir: 1 };
  let tablePage   = 1;
  const PAGE_SIZE = 80;

  // ── Oppsal card state ─────────────────────────────────────────────────────
  let oppsalCompetitors = [];
  let oppsalSort = { col: 'startTime', dir: 1 };
  let startOppsalVisible = lsGet('startOppsalVisible') === 'true';

  // ── Tab + live state ──────────────────────────────────────────────────────
  let activeTab = lsGet('activeTab') || 'start';
  let liveTimerInterval = null;
  let liveLastFetched = null;

  function elapsedSince(hhmm) {
    if (!hhmm) return '';
    const [h, m] = hhmm.split(':').map(Number);
    if (isNaN(h) || isNaN(m)) return '';
    const now = new Date();
    const elapsed = (now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds()) - (h * 3600 + m * 60);
    if (elapsed < 0) return '';
    return `${Math.floor(elapsed / 60)}:${String(elapsed % 60).padStart(2, '0')}`;
  }

  function deriveStartHHMM(finishDisp, raceMs) {
    if (!finishDisp || raceMs == null) return '';
    const [h, m] = finishDisp.split(':').map(Number);
    if (isNaN(h) || isNaN(m)) return '';
    const startS = (h * 3600 + m * 60) - raceMs / 1000;
    if (startS < 0) return '';
    return `${Math.floor(startS / 3600).toString().padStart(2, '0')}:${Math.floor((startS % 3600) / 60).toString().padStart(2, '0')}`;
  }

  function tickLiveTimers() {
    document.querySelectorAll('.live-timer[data-start]').forEach(el => {
      el.textContent = elapsedSince(el.dataset.start);
    });
  }

  function ensureLiveTimer() {
    if (liveTimerInterval) return;
    liveTimerInterval = setInterval(tickLiveTimers, 1000);
  }

  function stopLiveTimer() {
    if (liveTimerInterval) { clearInterval(liveTimerInterval); liveTimerInterval = null; }
  }
  let liveInputOpen = false;
  let liveIsVerified = false;
  let liveIsFutureRace = false;
  let liveAllEntries = [];
  let liveOfficialEntries = null;
  let liveRaatVisible = lsGet('liveRaatVisible') === 'true';
  let liveRaatSort = lsGet('liveRaatSort') || 'start';

  function buildTableFilters(competitors) {
    const classes = [...new Set(competitors.map(c => c.class))].sort(compareClasses);
    const allClubs = [...new Set(competitors.map(c => c.club).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    // Pin Oppsal to top with a separator; null renders as a disabled divider option.
    const oppsalClub = allClubs.find(c => c.toLowerCase().includes('oppsal'));
    if (pendingClassFilter !== null) {
      tableFilter.classes = new Set([pendingClassFilter]);
      tableFilter.club = '';
      pendingClassFilter = null;
    } else if (!tableFilter.club && oppsalClub) {
      tableFilter.club = oppsalClub;
      tablePage = 1;
    }
    const clubs = oppsalClub ? [oppsalClub, null, ...allClubs.filter(c => c !== oppsalClub)] : allClubs;

    const panel = document.getElementById('classMultiselectPanel');
    panel.innerHTML = classes.map(c => `
      <label class="ms-option">
        <input type="checkbox" value="${c.replace(/"/g, '&quot;')}"${tableFilter.classes.has(c) ? ' checked' : ''}>
        ${c}
      </label>`).join('');
    panel.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.addEventListener('change', () => {
        if (cb.checked) tableFilter.classes.add(cb.value);
        else tableFilter.classes.delete(cb.value);
        updateClassBtn();
        tablePage = 1;
        renderTable();
      });
    });

    if (oppsalClub) {
      document.getElementById('filterClub').innerHTML =
        '<option value="">Alle klubber</option>' +
        `<option value="${oppsalClub}">${oppsalClub}</option>` +
        `<optgroup label="─────────────">${allClubs.map(c => `<option value="${c}">${c}</option>`).join('')}</optgroup>`;
    } else {

  // ── Fetch competitors: start list first, fall back to entries ─────────────
  async function loadCompetitors(eventId) {
    const resp = await fetch(`${WORKER_URL}/startlist?eventId=${eventId}`);
    const text = await resp.text();
    if (resp.ok) {
      const competitors = parseStartList(parseXml(text));
      if (competitors.length) return competitors;
    }
    // No start list yet — try entries
    const eResp = await fetch(`${WORKER_URL}/entries?eventId=${eventId}`);
    const eText = await eResp.text();
    if (!eResp.ok) {
      let msg = `HTTP ${eResp.status}`;
      try { msg = JSON.parse(eText).error || msg; } catch {}
      throw new Error(msg);
    }
    const competitors = parseEntries(parseXml(eText));
    if (!competitors.length) throw new Error('Ingen påmeldte funnet');
    return competitors;
  }

  // ── Load events ────────────────────────────────────────────────────────────
  async function loadEvents() {
    try {
      const [resp, pinnedResp, runnersResp] = await Promise.all([
        fetch(`${WORKER_URL}/my-events`),
        fetch(`${WORKER_URL}/pinned-events`),
        fetch(`${WORKER_URL}/pinned-runners`),
      ]);
      const text = await resp.text();
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

      const pinned = pinnedResp.ok ? await pinnedResp.json().catch(() => []) : [];
      pinnedEventIds = new Set(pinned.map(e => e.id));
      pinnedRunners = new Set(runnersResp.ok ? await runnersResp.json().catch(() => []) : []);

      const doc = parseXml(text);
      allEvents = parseEvents(doc);
      trackedStartsByEvent = parseTrackedStarts(doc);

      const existingIds = new Set(allEvents.map(e => e.id));
      for (const e of pinned) {
        if (!existingIds.has(e.id)) allEvents.push(e);
      }
      allEvents.sort((a, b) => a.date.localeCompare(b.date));

      if (!allEvents.length) {
        document.getElementById('eventSelect').innerHTML = '<option value="">Ingen arrangementer funnet</option>';
        return;
      }

      populateEventSelect();
      document.getElementById('reloadEventsBtn').disabled = false;

      document.getElementById('velgLopBtn').disabled = false;
      const sel = document.getElementById('eventSelect');
      const today = new Date().toISOString().slice(0, 10);
      const savedId   = lsGet('lastEventId');
      const savedDate = lsGet('lastEventDate');
      const ids = [...sel.options].map(o => o.value);
      const autoId = (savedId && savedDate === today && ids.includes(savedId))
        ? savedId
        : (allEvents.find(e => e.date >= today) || allEvents[allEvents.length - 1])?.id;
      if (autoId) {
        sel.value = autoId;
        lsSet('lastEventId', autoId);
        lsSet('lastEventDate', today);
        updateHero(autoId);
        showEventPreview(autoId);
        if (activeTab === 'live') initLiveTab(autoId);
      }
    } catch (e) {
      setMessage(`Kunne ikke laste arrangementer: ${e.message}`);
      document.getElementById('eventSelect').innerHTML = '<option value="">Feil ved lasting</option>';
    }
  }

  // ── Event documents (PM link, live URL) ───────────────────────────────────
  const docsByEvent = {};        // eventId → resolved json (after fetch completes)
  const docsFetchByEvent = {};   // eventId → Promise (while fetch is in flight)
  const docLiveUrlByEvent = {};  // eventId → liveUrl (populated after fetch)

  function _applyEventDocs(eventId, json) {
    if (!json || document.getElementById('eventSelect').value !== eventId) return;
    const applyDocLink = (el, url) => {
      if (url) {
        el.href = url;
        el.style.opacity = '';
        el.style.pointerEvents = '';
        el.style.cursor = '';
      } else {
        el.removeAttribute('href');
        el.style.opacity = '0.35';
        el.style.pointerEvents = 'none';
        el.style.cursor = 'default';
      }
      el.classList.remove('hidden');
    };
    applyDocLink(document.getElementById('pm-link'), json.pmUrl);
    if (json.liveUrl) docLiveUrlByEvent[eventId] = json.liveUrl;
  }

  function loadEventDocs(eventId) {
    if (docsByEvent[eventId] !== undefined) {
      _applyEventDocs(eventId, docsByEvent[eventId]);
      return Promise.resolve(docsByEvent[eventId]);
    }
    if (docsFetchByEvent[eventId]) {
      return docsFetchByEvent[eventId].then(() => _applyEventDocs(eventId, docsByEvent[eventId]));
    }
    const p = fetch(`${WORKER_URL}/eventdocs?eventId=${eventId}`)
      .then(r => r.ok ? r.json() : {})
      .then(json => {
        docsByEvent[eventId] = json;
        _applyEventDocs(eventId, json);
        return json;
      })
      .catch(() => { docsByEvent[eventId] = null; });
    docsFetchByEvent[eventId] = p;
    return p;
  }

  function classifyLiveEntry(status, t, finishDisp, startDisp, position) {
    const startPart  = startDisp  ? `Start ${startDisp}`  : '';
    const finishPart = finishDisp ? `Mål ${finishDisp}`   : '';
    const canStart = !liveIsFutureRace;
    if (status === 'DidNotStart') {
      const started = canStart && startDisp && (() => {
        const now = new Date();
        const [h, m] = startDisp.split(':').map(Number);
        return (now.getHours() * 60 + now.getMinutes()) > (h * 60 + m);
      })();
      return { rowClass: started ? 'live-running' : 'live-bad', detailParts: [startPart] };
    }
    if (status === 'DidNotFinish') return { rowClass: 'live-bad',  detailParts: ['DNF', startPart] };
    if (status === 'Disqualified') return { rowClass: 'live-bad',  detailParts: ['DSQ', startPart] };
    if (status === 'MissingPunch') return { rowClass: 'live-done', detailParts: [startPart, finishPart, t != null ? fmtMs(t) : '', 'MP'] };
    if (t != null) {
      const parts = [startPart, finishPart, fmtMs(t)];
      if (position !== undefined) parts.push(`${position ?? '–'}. plass`);
      return { rowClass: 'live-done', detailParts: parts };
    }
    const hasStarted = canStart && startDisp && (() => {
      const now = new Date();
      const [h, m] = startDisp.split(':').map(Number);
      return (now.getHours() * 60 + now.getMinutes()) > (h * 60 + m);
    })();
    return { rowClass: hasStarted ? 'live-running' : 'live-bad', detailParts: [startPart] };
  }

        fetch(`${WORKER_URL}/livelink?eventId=${eventId}`, { method: 'POST' }).catch(() => {});
        document.getElementById('liveResLink').classList.add('hidden');
        showLiveUrlInput(eventId);
        return;
      }
      const m = val.match(/comp=([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[0-9]+)/i);
      if (!m) {
        document.getElementById('liveUrlInput').style.borderColor = 'var(--error-border)';
        resultEl.style.color = '#c0392b'; resultEl.textContent = 'Ugyldig lenke';
        disableGet(); return;
      }
      document.getElementById('liveUrlInput').style.borderColor = '';
      resultEl.style.color = 'var(--neutral-600)'; resultEl.textContent = 'Henter løpsnavn…';
      try {
        const resp = await fetch(`${WORKER_URL}/raceinfo?raceId=${encodeURIComponent(m[1])}`);
        const data = await resp.json().catch(() => ({}));
        const name = data?.data?.name || data?.data?.title || data?.name || data?.title || '';
        const rawDate = data?.data?.date || data?.date || '';
        const dateParts = rawDate.split('-');
        const dateStr = dateParts.length === 3 ? `${dateParts[2]}/${dateParts[1]}` : '';
        const ok   = `<span style="color:var(--green-dark);font-weight:700">✓</span>`;
        const warn = `<span style="color:#e67e22;font-weight:700">⚠</span>`;
        if (name) {
          const eventName = allEvents.find(e => e.id === eventId)?.name || '';
          const normalize = s => s.toLowerCase().replace(/[^a-zæøåéèà0-9 ]/g, '').replace(/\s+/g, ' ').trim();
          const matches = normalize(name) === normalize(eventName);
          const eventDate = allEvents.find(e => e.id === eventId)?.date || '';
          const dateMatches = !rawDate || !eventDate || rawDate === eventDate;
          verifyMatchOk = matches && dateMatches;
          const eventDateParts = eventDate.split('-');
          const eventDateStr = eventDateParts.length === 3 ? `${eventDateParts[2]}/${eventDateParts[1]}` : '';
          const dateLine = dateStr
            ? `<div>${dateMatches ? ok : warn} ${dateStr}${!dateMatches && eventDateStr ? ` <span style="color:#e67e22;font-size:0.82rem">(valgt løp: ${eventDateStr})</span>` : ''}</div>`
            : '';
          resultEl.style.color = 'var(--dark)';
          resultEl.innerHTML = `
            <div>${matches ? ok : warn} ${name}${!matches ? ` <span style="color:#e67e22;font-size:0.82rem">matcher ikke valgt løp</span>` : ''}</div>
            ${dateLine}`;
        } else {
          resultEl.style.color = 'var(--neutral-600)';
          resultEl.textContent = 'Løpsnavn ikke tilgjengelig';
        }
        verifiedRaceId = m[1];
        const btn = document.getElementById('liveUrlSubmit');
        btn.disabled = false; btn.style.opacity = ''; btn.style.cursor = '';
      } catch { resultEl.style.color = '#c0392b'; resultEl.textContent = 'Feil ved henting'; disableGet(); }
    };

    const submit = () => {
      if (!verifiedRaceId) return;
      liveInputOpen = false;
      liveIsVerified = verifyMatchOk === true ? 'ok' : verifyMatchOk === false ? 'mismatch' : false;
      loadLiveByRaceId(verifiedRaceId, eventId);
    };

    document.getElementById('liveUrlInput').addEventListener('input', resetVerify);
    document.getElementById('liveUrlClear').addEventListener('click', () => {
      const input = document.getElementById('liveUrlInput');
      input.value = ''; input.style.borderColor = '';
      resetVerify(); input.focus();
    });
    document.getElementById('liveUrlVerify').addEventListener('click', verify);
    document.getElementById('liveUrlSubmit').addEventListener('click', submit);
    document.getElementById('liveUrlInput').addEventListener('keydown', e => { if (e.key === 'Enter') verify(); });
    if (existingRaceId) {
      document.getElementById('liveUrlCancel').addEventListener('click', () => {
        liveInputOpen = false;
        document.getElementById('liveRaatSection').classList.remove('hidden');
        setLiveResLink(existingRaceId, eventId);
        loadLiveByRaceId(existingRaceId, eventId);
      });
    }
  }

  async function loadLiveByRaceId(raceId, eventId, silent = false) {
    const card = document.getElementById('liveCard');
    const eventDate = allEvents.find(e => e.id === eventId)?.date || '';
    const today = new Date().toISOString().slice(0, 10);
    liveIsFutureRace = !!(eventDate && eventDate > today);
    if (!silent) card.innerHTML = '<div class="loading-msg">Laster resultater…</div>';
    try {
      const ac = new AbortController();
      const acTimer = setTimeout(() => ac.abort(), 15000);
      let resp;
      try {
        resp = await fetch(`${WORKER_URL}/liveresults?raceId=${encodeURIComponent(raceId)}`, { signal: ac.signal });
      } finally {
        clearTimeout(acTimer);
      }
      if (document.getElementById('eventSelect').value !== eventId) return;
      const json = await resp.json().catch(() => ({}));
      if (document.getElementById('eventSelect').value !== eventId) return;
      if (!resp.ok) {
        if (!silent) card.innerHTML = `<div class="error-msg">${json.error || `HTTP ${resp.status}`}</div>`;
        return;
      }
      lsSet(`liveRaceId:${eventId}`, raceId);
      const verifiedParam = liveIsVerified === 'ok' ? 'ok' : liveIsVerified === 'mismatch' ? 'mismatch' : 'unverified';
      fetch(`${WORKER_URL}/livelink?eventId=${eventId}&raceId=${encodeURIComponent(raceId)}&verified=${verifiedParam}`, { method: 'POST' }).catch(() => {});
      liveLastFetched = new Date();
      liveAllEntries = Array.isArray(json.data) ? json.data : [];
      const entries = liveAllEntries.filter(e => TRACKED.includes(e.person?.name));
      const hasFinish = entries.some(e => e.time?.time != null);
      const hasLiveTiming = liveAllEntries.some(e => e.status?.status !== 'DidNotStart');
      if (!hasFinish && !hasLiveTiming) {
        try {
          const oResp = await fetch(`${WORKER_URL}/eventresults?eventId=${eventId}`);
          if (document.getElementById('eventSelect').value !== eventId) return;
          const oJson = await oResp.json().catch(() => ({}));
          const oData = Array.isArray(oJson.data) ? oJson.data : [];
          const oEntries = oData.filter(e => TRACKED.includes(e.person?.name));
          if (oEntries.some(e => e.time?.time != null)) {
            liveOfficialEntries = { data: oData, entries: oEntries };
            liveAllEntries = oData;
            renderLiveCard(oEntries, eventId, raceId, true);
          } else if (liveOfficialEntries) {
            liveAllEntries = liveOfficialEntries.data;
            renderLiveCard(liveOfficialEntries.entries, eventId, raceId, true);
          } else {
            renderLiveCard(entries, eventId, raceId);
          }
        } catch {
          if (liveOfficialEntries) {
            liveAllEntries = liveOfficialEntries.data;
            renderLiveCard(liveOfficialEntries.entries, eventId, raceId, true);
          } else {
            renderLiveCard(entries, eventId, raceId);
          }
        }
      } else {
        renderLiveCard(entries, eventId, raceId);
      }
      if (document.getElementById('liveRaatDetails')?.open) renderLiveRaatCard(eventId);
      fetch(`${WORKER_URL}/raceinfo?raceId=${encodeURIComponent(raceId)}`)
        .then(r => r.json()).then(info => {
          const name = info.data?.name || info.data?.title || '';
          setLiveResLink(raceId, eventId, name);
        }).catch(() => setLiveResLink(raceId, eventId));
    } catch (e) {
      if (!silent) card.innerHTML = `<div class="error-msg">${e.message}</div>`;
    }
  }

  function renderLiveCard(entries, eventId, raceId, isOfficial = false) {
    if (liveInputOpen) return;
    const card = document.getElementById('liveCard');
    const timeStr = (!isOfficial && liveLastFetched)
      ? liveLastFetched.toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
      : '';

    const header = `
      <div class="live-header">
        <div class="live-title-block">
          <span class="live-title">${isOfficial ? 'Offisielle resultater' : 'Live resultater'}</span>
          ${timeStr ? `<span class="live-updated">Oppdatert ${timeStr}</span>` : ''}
        </div>
        <button class="btn-refresh" id="liveRefreshBtn">Oppdater</button>
      </div>`;

    const bindButtons = () => {
      document.getElementById('liveRefreshBtn').addEventListener('click', () => loadLiveByRaceId(raceId, eventId));
    };

    if (!entries.length) {
      card.innerHTML = `<div class="tracked-card" style="padding:10px 18px">${header}
        <p style="color:var(--neutral-600);font-size:0.88rem;padding:8px 0">Ingen av de sporede utøverne er funnet i live-resultatene ennå.</p>
      </div>`;
      bindButtons();
      document.getElementById('liveRaatSection').classList.remove('hidden');
      document.getElementById('liveRaatDetails').open = liveRaatVisible;
      if (liveRaatVisible) renderLiveRaatCard(eventId);
      return;
    }

    const trackedStarts = trackedStartsByEvent[eventId] || [];
    const sorted = [...entries].sort((a, b) => {
      const aDns = a.status?.status === 'DidNotStart';
      const bDns = b.status?.status === 'DidNotStart';
      if (aDns !== bDns) return aDns ? 1 : -1;
      const as = trackedStarts.find(s => s.fullName === a.person?.name)?.startTime || '';
      const bs = trackedStarts.find(s => s.fullName === b.person?.name)?.startTime || '';
      return as.localeCompare(bs);
    });

    const rows = sorted.map(e => {
      const fullName  = e.person?.name || '';
      const name      = TRACKED_DISPLAY[fullName] || fullName || '–';
      const startInfo = trackedStarts.find(s => s.fullName === fullName);
      const cls       = startInfo?.class || '';
      let startDisp = (startInfo ? fmtTime(startInfo.startTime) : '') || e.time?.startHHMM || '';

      const status   = e.status?.status || '';
      const t        = e.time?.time;
      const finishDisp = e.time?.finishTime
        ? new Date(e.time.finishTime).toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' })
        : e.time?.finishHHMM || '';
      if (!startDisp && finishDisp && t != null) startDisp = deriveStartHHMM(finishDisp, t);
      const { rowClass, detailParts } = classifyLiveEntry(status, t, finishDisp, startDisp, e.position);

      const parts = detailParts.filter(Boolean);
      if (rowClass === 'live-running' && startDisp && parts.length > 0)
        parts[0] += '  ·  ' + `<span class="live-timer" data-start="${startDisp}"></span>`;
      const detailHtml = parts.join('  ·  ');

      return `<div class="live-person ${rowClass}">
        <div class="live-row1">
          <span class="live-pname">${name}</span>
          ${cls ? `<span class="live-pclass">${cls}</span>` : ''}
        </div>
        <div class="live-row2">
          <span class="live-pdetails">${detailHtml}</span>
        </div>
      </div>`;
    }).join('');

    card.innerHTML = `<div class="tracked-card" style="padding:10px 18px">${header}
      <div class="live-list">${rows}</div>
    </div>`;

    tickLiveTimers(); ensureLiveTimer();
    bindButtons();
    document.getElementById('liveRaatSection').classList.remove('hidden');
    document.getElementById('liveRaatDetails').open = liveRaatVisible;
    if (liveRaatVisible) renderLiveRaatCard(eventId);
  }

  async function renderLiveRaatCard(eventId) {
    if (liveInputOpen) return;
    if (document.getElementById('eventSelect').value !== eventId) return;
    const card = document.getElementById('liveRaatCard');
    if (cachedStartListEventId !== eventId || !allCompetitors.length) {
      card.innerHTML = `<p style="color:var(--neutral-600);font-size:0.88rem;padding:8px 0">Laster startliste…</p>`;
      try {
        allCompetitors = await loadCompetitors(eventId);
        cachedStartListEventId = eventId;
        if (document.getElementById('eventSelect').value !== eventId) return;
      } catch (e) {
        card.innerHTML = `<p style="color:var(--neutral-600);font-size:0.88rem;padding:8px 0">Kunne ikke laste startliste.</p>`;
        return;
      }
    }
    const oppsalRunners = allCompetitors.filter(isOppsalRunner);
    if (!oppsalRunners.length) { card.innerHTML = ''; return; }

    const rows = oppsalRunners.map(runner => {
      const entry     = liveAllEntries.find(e => e.person?.name === runner.fullName);
      let startDisp = fmtTime(runner.startTime) || entry?.time?.startHHMM || '';
      const status   = entry?.status?.status || '';
      const t        = entry?.time?.time;
      const finishDisp = entry?.time?.finishTime
        ? new Date(entry.time.finishTime).toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' })
        : entry?.time?.finishHHMM || '';
      if (!startDisp && finishDisp && t != null) startDisp = deriveStartHHMM(finishDisp, t);
      const { rowClass, detailParts } = classifyLiveEntry(status, t, finishDisp, startDisp);
      const parts = detailParts.filter(Boolean);
      if (rowClass === 'live-running' && startDisp && parts.length > 0)
        parts[0] += '&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;' + `<span class="live-timer" data-start="${startDisp}"></span>`;
      const detailHtml = parts.join('&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;');
      return {
        html: `<div class="live-person ${rowClass} live-blue">
          <div class="live-row1">
            <span class="live-pname">${shortenName(runner.fullName)}</span>
            ${runner.class ? `<span class="live-pclass">${runner.class}</span>` : ''}
          </div>
          <div class="live-row2"><span class="live-pdetails">${detailHtml}</span></div>
        </div>`,
        pos: entry?.position ?? (rowClass === 'live-done' ? 9998 : 9999),
        startTime: runner.startTime,
        firstName: runner.fullName.split(' ')[0],
        cls: runner.class,
        dns: status === 'DidNotStart',
      };
    }).sort((a, b) => {
      if (liveRaatSort === 'name')  return a.firstName.localeCompare(b.firstName, 'no');
      if (liveRaatSort === 'class') return compareClasses(a.cls, b.cls) || a.firstName.localeCompare(b.firstName, 'no');
      const aNoStart = !a.startTime, bNoStart = !b.startTime;
      if (aNoStart !== bNoStart) return aNoStart ? 1 : -1;
      if (a.dns !== b.dns) return a.dns ? 1 : -1;
      return (a.startTime || '').localeCompare(b.startTime || '');
    });

    const sortBtns = [['start', 'Starttid'], ['name', 'Navn'], ['class', 'Klasse']].map(([s, label]) =>
      `<button class="lraat-sort-btn${liveRaatSort === s ? ' active' : ''}" data-sort="${s}">${label}</button>`
    ).join('');

    const summary = document.getElementById('liveRaatSummary');
    summary.innerHTML = `Råtasser: ${oppsalRunners.length}&nbsp;deltagere<div class="lraat-sort"><span class="lraat-sort-icon">⇅</span>${sortBtns}</div>`;
    card.innerHTML = `<div class="live-list">${rows.map(r => r.html).join('')}</div>`;
    tickLiveTimers(); ensureLiveTimer();
    summary.querySelectorAll('.lraat-sort-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        liveRaatSort = btn.dataset.sort;
        lsSet('liveRaatSort', liveRaatSort);
        renderLiveRaatCard(eventId);
      });
    });
  }

  // ── Event listeners ────────────────────────────────────────────────────────
  document.getElementById('eventSelect').addEventListener('change', function () {
    updateHero(this.value);
    if (this.value) {
      lsSet('lastEventId', this.value);
      lsSet('lastEventDate', new Date().toISOString().slice(0, 10));
      showEventPreview(this.value);
      if (activeTab === 'live') initLiveTab(this.value);
    }
  });


  document.getElementById('velgLopBtn').addEventListener('click', e => {
    e.stopPropagation();
    const panel = document.getElementById('velgLopPanel');
    document.documentElement.style.setProperty('--header-h', document.querySelector('header').offsetHeight + 'px');
    const wasOpen = panel.classList.contains('open');
    if (!wasOpen) populateVelgLopPanel();
    panel.classList.toggle('open');
    if (!wasOpen) panel.scrollTop = panel.scrollHeight;
  });
  document.addEventListener('click', () => {
    document.getElementById('velgLopPanel').classList.remove('open');
  });
  document.getElementById('velgLopPanel').addEventListener('click', e => e.stopPropagation());
  document.getElementById('tabStartBtn').addEventListener('click', () => switchTab('start'));
  document.getElementById('tabLiveBtn').addEventListener('click', () => switchTab('live'));
  document.getElementById('liveRaatDetails').addEventListener('toggle', function () {
    liveRaatVisible = this.open;
    lsSet('liveRaatVisible', this.open);
    if (this.open) renderLiveRaatCard(document.getElementById('eventSelect').value);
  });

  // Apply persisted tab without triggering live load (events not loaded yet)
  document.getElementById('tab-start').classList.toggle('hidden', activeTab !== 'start');
  document.getElementById('tab-live').classList.toggle('hidden', activeTab !== 'live');
  document.getElementById('tabStartBtn').classList.toggle('active', activeTab === 'start');
  document.getElementById('tabLiveBtn').classList.toggle('active', activeTab === 'live');

  loadEvents();
  loadRatassMembers();
</script>
